name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - run: npm install --no-audit --no-fund
      - run: npx -y -p typescript@5.9.3 -p @types/node tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --allowImportingTsExtensions --types node index.ts
      - run: npm test
