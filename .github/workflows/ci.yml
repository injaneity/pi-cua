name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - run: npm install --no-save typescript@5.9.3 prettier @types/node @earendil-works/pi-coding-agent @earendil-works/pi-ai @earendil-works/pi-tui typebox
      - run: uvx ruff format --check backend.py test_backend.py
      - run: uvx ruff check backend.py test_backend.py
      - run: uvx vulture backend.py --min-confidence 90
      - run: python3 -m unittest -q test_backend.py
      - run: node --test test-tool-broker.mjs test-session-lifecycle.mjs test-subagents.mjs
      - run: npx prettier --check index.ts subagents.ts tool-host.mjs tool-broker.mjs test-tool-broker.mjs test-session-lifecycle.mjs test-subagents.mjs README.md
      - run: npx tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --types node index.ts
