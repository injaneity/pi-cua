name: build boot-preserving linux 30gb containerdisk

on:
  push:
    branches: [build/linux-50gb]

permissions:
  contents: read
  packages: write

env:
  SOURCE_IMAGE: public.ecr.aws/k5j5w0x5/cua-ubuntu-24.04@sha256:85b3f5022bf9ecc864472f5fade5e2f1f54ab88ce429af7873a1415d668dc2ea
  STAGING_IMAGE: ghcr.io/injaneity/pi-cua-linux:30gb-preserved-staging
  TARGET_IMAGE: ghcr.io/injaneity/pi-cua-linux:30gb-preserved-amd64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: reclaim runner storage
        run: |
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af

      - name: install image tools
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils cloud-guest-utils gdisk libguestfs-tools linux-image-generic socat imagemagick tesseract-ocr
          sudo chmod 0644 /boot/vmlinuz-*

      - name: resize root without changing partition numbers
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_MEMSIZE: "1024"
        run: |
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          container=$(docker create --platform linux/amd64 "$SOURCE_IMAGE" /bin/true)
          docker cp "$container:/disk/disk.img" disk.source.qcow2
          docker rm "$container"
          docker image rm "$SOURCE_IMAGE"

          # The published disk is qcow2 despite its .img suffix. Keep it qcow2;
          # treating it as raw corrupts its header and hides every partition.
          test "$(qemu-img info --output=json disk.source.qcow2 | jq -r .format)" = qcow2
          qemu-img resize disk.source.qcow2 30G
          sudo modprobe nbd max_part=32
          sudo qemu-nbd --connect=/dev/nbd0 disk.source.qcow2
          trap 'sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true' EXIT
          sudo udevadm settle
          sudo sgdisk -e /dev/nbd0
          sudo qemu-nbd --disconnect /dev/nbd0

          # Reconnect after repairing the backup GPT so the kernel scans the
          # corrected table and exposes the original root as partition 1.
          sudo qemu-nbd --connect=/dev/nbd0 disk.source.qcow2
          sudo udevadm settle
          sudo lsblk -o NAME,SIZE,TYPE,FSTYPE /dev/nbd0
          test -b /dev/nbd0p1
          sudo growpart /dev/nbd0 1
          sudo partprobe /dev/nbd0
          sudo udevadm settle
          sudo e2fsck -fy /dev/nbd0p1
          sudo resize2fs /dev/nbd0p1
          sudo qemu-nbd --disconnect /dev/nbd0
          trap - EXIT

          qemu-img convert -p -O qcow2 -c disk.source.qcow2 disk.qcow2
          rm disk.source.qcow2
          qemu-img info disk.qcow2
          virt-filesystems -a disk.qcow2 --all --long --uuid -h
          virt-df -h -a disk.qcow2

      - name: boot-test resized disk
        run: |
          set +e
          qemu-system-x86_64 \
            -accel tcg \
            -machine q35 \
            -cpu max \
            -smp 2 \
            -m 4096 \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::18000-:8000 \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -monitor unix:qemu-monitor.sock,server=on,wait=off \
            -serial file:serial.log \
            >qemu.stdout 2>qemu.stderr &
          pid=$!
          booted=false
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/status; then
              booted=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          printf 'screendump boot.ppm\n' | socat - UNIX-CONNECT:qemu-monitor.sock || true
          convert boot.ppm boot.png 2>/dev/null || true
          echo "--- boot screen OCR ---"
          tesseract boot.png stdout 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "--- qemu stderr ---"
          cat qemu.stderr
          echo "--- serial console ---"
          cat serial.log
          echo "service_ready=$booted"
          test "$booted" = true

      - name: publish tested containerdisk
        run: |
          mkdir -p layer/disk
          mv disk.qcow2 layer/disk/disk.img
          tar -czf disk-layer.tar.gz -C layer disk
          version=0.20.6
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${version}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          crane append --new_layer disk-layer.tar.gz --new_tag "$STAGING_IMAGE"
          crane mutate "$STAGING_IMAGE" --set-platform linux/amd64 --tag "$TARGET_IMAGE"
          digest=$(crane digest "$TARGET_IMAGE")
          crane config "$TARGET_IMAGE" | jq '{os, architecture, rootfs}'
          echo "image: $TARGET_IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
