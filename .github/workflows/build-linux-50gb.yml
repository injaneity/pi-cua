name: fix linux containerdisk platform

on:
  push:
    branches: [build/linux-50gb]

permissions:
  contents: read
  packages: write

env:
  SOURCE_IMAGE: ghcr.io/injaneity/pi-cua-linux@sha256:096a0619a7bbe9d2eff7f9263e57762764a25589e1702cd8e04f39ad0d3eb3fd
  TARGET_IMAGE: ghcr.io/injaneity/pi-cua-linux:30gb-eb68411-amd64

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: publish amd64 image metadata
        run: |
          version=0.20.6
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${version}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          crane mutate "$SOURCE_IMAGE" \
            --set-platform linux/amd64 \
            --tag "$TARGET_IMAGE"
          digest=$(crane digest "$TARGET_IMAGE")
          crane config "$TARGET_IMAGE" | jq '{os, architecture, rootfs}'
          echo "image: $TARGET_IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
