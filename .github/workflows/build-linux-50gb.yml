name: diagnose resized linux boot

on:
  push:
    branches: [build/linux-50gb]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/injaneity/pi-cua-linux@sha256:31b5392b69313bf7855945455a9a9a1fd2cf7b09b56ca2deea5d4b1c3f6146cc

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: reclaim runner storage
        run: |
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af

      - name: install diagnostics
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils libguestfs-tools linux-image-generic socat imagemagick tesseract-ocr
          sudo chmod 0644 /boot/vmlinuz-*
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: extract and inspect disk
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_MEMSIZE: "1024"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$IMAGE"
          container=$(docker create --platform linux/amd64 "$IMAGE" /bin/true)
          docker cp "$container:/disk/disk.img" disk.img
          docker rm "$container"
          qemu-img info disk.img
          virt-filesystems -a disk.img --all --long --uuid -h
          virt-df -h -a disk.img

      - name: boot with Fleet-compatible BIOS settings
        run: |
          set +e
          format=$(qemu-img info --output=json disk.img | jq -r .format)
          qemu-system-x86_64 \
            -accel tcg \
            -machine q35 \
            -cpu max \
            -smp 2 \
            -m 4096 \
            -drive file=disk.img,format="$format",if=virtio \
            -netdev user,id=net0,hostfwd=tcp::18000-:8000 \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -monitor unix:qemu-monitor.sock,server=on,wait=off \
            -serial file:serial.log \
            >qemu.stdout 2>qemu.stderr &
          pid=$!
          booted=false
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/status; then
              booted=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 5
          done
          printf 'info status\ninfo block\nscreendump boot.ppm\n' | socat - UNIX-CONNECT:qemu-monitor.sock || true
          convert boot.ppm boot.png 2>/dev/null || true
          echo "--- boot screen OCR ---"
          tesseract boot.png stdout 2>/dev/null || true
          echo "--- monitor ---"
          printf 'info status\ninfo block\n' | socat - UNIX-CONNECT:qemu-monitor.sock || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "--- qemu stderr ---"
          cat qemu.stderr
          echo "--- serial console ---"
          cat serial.log
          echo "--- result ---"
          echo "service_ready=$booted"
          test "$booted" = true
